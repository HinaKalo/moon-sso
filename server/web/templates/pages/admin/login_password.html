{{define "auth_form"}}
<form method="post" action="/login/password" hx-post="/login/password" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button" class="form">
  {{template "csrf" .}}
  {{template "alerts" .}}
  <p>当前是临时密码，请设置一个只有你知道的新密码（至少 12 位）。</p>
  <label class="field"><span>新密码</span><input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" autofocus></label>
  {{template "ferr" dict "Errors" .Errors "Field" "password"}}
  <label class="field"><span>确认新密码</span><input name="password_confirm" type="password" autocomplete="new-password" required maxlength="128"></label>
  {{template "ferr" dict "Errors" .Errors "Field" "password_confirm"}}
  <button class="btn btn-primary btn-block" type="submit">保存并继续 {{template "spinner"}}</button>
</form>
{{end}}
